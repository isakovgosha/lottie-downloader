<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lottie Downloader</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 360px;
      min-height: 200px;
      max-height: 580px;
      font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
      font-size: 13px;
      background: #f5f5ff;
      color: #1e1b4b;
      display: flex;
      flex-direction: column;
    }

    /* ── Header ── */
    header {
      background: linear-gradient(135deg, #4f46e5, #7c3aed);
      color: #fff;
      padding: 10px 14px 10px;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }
    #header-motor {
      width: 40px;
      height: 40px;
      flex-shrink: 0;
    }
    .header-title { font-size: 15px; font-weight: 700; letter-spacing: -0.01em; flex: 1; }
    #count {
      font-size: 11px;
      background: rgba(255,255,255,0.22);
      border-radius: 20px;
      padding: 2px 8px;
      font-weight: 600;
    }

    /* ── Toolbar ── */
    .toolbar {
      display: flex;
      gap: 6px;
      padding: 8px 10px;
      background: #ededff;
      border-bottom: 1px solid #ddd8ff;
      flex-shrink: 0;
    }
    .toolbar button {
      flex: 1;
      background: #fff;
      border: 1px solid #c7d2fe;
      border-radius: 5px;
      padding: 5px 8px;
      font-size: 11px;
      font-family: inherit;
      color: #4338ca;
      cursor: pointer;
      font-weight: 500;
      transition: background 0.12s;
    }
    .toolbar button:hover { background: #eef2ff; }
    #btn-download-all {
      background: #4f46e5 !important;
      color: #fff !important;
      border-color: #4f46e5 !important;
    }
    #btn-download-all:hover { background: #4338ca !important; }

    /* ── List ── */
    #list {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    /* ── Empty state ── */
    #empty {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 20px 20px;
      color: #9ca3af;
      text-align: center;
    }
    #empty-lupa {
      width: 90px;
      height: 90px;
    }
    #empty p { font-size: 12px; line-height: 1.5; }

    /* ── Animation card ── */
    .anim-card {
      background: #fff;
      border: 1px solid #e0e7ff;
      border-radius: 8px;
      padding: 10px 11px;
      display: flex;
      gap: 10px;
      align-items: flex-start;
      transition: box-shadow 0.15s;
    }
    .anim-card:hover { box-shadow: 0 2px 10px rgba(79, 70, 229, 0.12); }

    .anim-thumb {
      width: 56px;
      height: 56px;
      border-radius: 8px;
      background: linear-gradient(135deg, #e0e7ff, #ddd6fe);
      flex-shrink: 0;
      overflow: hidden;
      cursor: pointer;
      position: relative;
    }
    .anim-thumb svg {
      width: 100% !important;
      height: 100% !important;
      display: block;
    }

    .anim-info { flex: 1; min-width: 0; }

    .anim-name {
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: #1e1b4b;
      margin-bottom: 3px;
    }

    .anim-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-bottom: 6px;
    }
    .tag {
      font-size: 10px;
      background: #ede9fe;
      color: #5b21b6;
      border-radius: 3px;
      padding: 1px 5px;
      font-weight: 500;
    }
    .tag.source { background: #d1fae5; color: #065f46; }

    .btn-row {
      display: flex;
      gap: 5px;
    }
    .btn-row button {
      border: none;
      border-radius: 4px;
      padding: 4px 9px;
      font-size: 11px;
      font-family: inherit;
      cursor: pointer;
      font-weight: 500;
      transition: background 0.12s;
    }
    .btn-dl {
      background: #4f46e5;
      color: #fff;
    }
    .btn-dl:hover { background: #4338ca; }
    .btn-hl {
      background: #ede9fe;
      color: #5b21b6;
    }
    .btn-hl:hover { background: #ddd6fe; }
    .btn-nodata { background: #fef3c7 !important; color: #92400e !important; cursor: default; font-size: 10px; }

    /* ── Footer ── */
    footer {
      border-top: 1px solid #ddd8ff;
      padding: 6px 12px;
      font-size: 10px;
      color: #a5b4fc;
      text-align: center;
      flex-shrink: 0;
    }
    footer a {
      color: #818cf8;
      text-decoration: none;
      font-weight: 600;
    }
    footer a:hover {
      color: #a78bfa;
      text-decoration: underline;
    }
  </style>
</head>
<body>

<header>
  <div id="header-motor"></div>
  <span class="header-title">Lottie Downloader</span>
  <span id="count">0 анимаций</span>
</header>

<div class="toolbar">
  <button id="btn-refresh">↻ Обновить</button>
  <button id="btn-download-all" disabled>↓ Скачать все</button>
  <button id="btn-clear">✕ Очистить</button>
</div>

<div id="list">
  <div id="empty">
    <div id="empty-lupa"></div>
    <p>Lottie-анимации не найдены.<br>Откройте страницу с анимацией<br>и нажмите «Обновить».</p>
  </div>
</div>

<footer>
  Lottie Downloader v1.1 by <a href="https://t.me/onegog_design" target="_blank" id="author-link">OneGog</a>
</footer>

<script src="lottie_light.min.js"></script>
<script src="popup-animations.js"></script>
<script src="popup.js"></script>
</body>
</html>
